site_name: Markets, Simplified
site_description: Fiches détaillées de la série LinkedIn Markets, Simplified (taux, crédit, options)
site_author: Marwane Benaddi
site_url: https://senchi-dev.github.io/markets-simplified/
repo_url: https://github.com/senchi-dev/markets-simplified

theme:
  name: material
  language: fr
  font: false
  icon:
    logo: material/lightbulb-on-outline
    repo: fontawesome/brands/github
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy

extra_css:
  - stylesheets/brand.css

extra:
  generator: false

plugins:
  - search:
      lang:
        - fr
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          site_description: Detailed notes for the Markets, Simplified LinkedIn series (rates, credit, options)
          nav_translations:
            Accueil: Home
            Taux et obligations: Rates and bonds
            Crédit: Credit
            Swaps et financement: Swaps and funding
            Les Greeks: The Greeks
            Volatilité: Volatility
            Stratégies: Strategies

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Accueil: index.md
  - Taux et obligations:
      - "1. Fixed vs Floating Rate Debt": episodes/01-fixed-vs-floating-rate-debt.md
      - "2. The Yield Curve": episodes/02-the-yield-curve.md
      - "3. Duration": episodes/03-duration.md
      - "4. DV01": episodes/04-dv01.md
  - Crédit:
      - "5. Credit Spread": episodes/05-credit-spread.md
      - "6. Credit Default Swaps (CDS)": episodes/06-credit-default-swaps.md
      - "7. CDS Indices (CDX & iTraxx)": episodes/07-cds-indices.md
      - "8. CDO Tranches": episodes/08-cdo-tranches.md
      - "9. The Big Short": episodes/09-the-big-short.md
  - Swaps et financement:
      - "10. Interest Rate Swaps (IRS)": episodes/10-interest-rate-swaps.md
      - "11. Repo": episodes/11-repo.md
      - "12. Short Selling": episodes/12-short-selling.md
  - Options:
      - "13. Options (Calls & Puts)": episodes/13-options.md
      - "14. Put-Call Parity": episodes/14-put-call-parity.md
  - Les Greeks:
      - "15. Delta": episodes/15-delta.md
      - "16. Gamma": episodes/16-gamma.md
      - "17. Theta": episodes/17-theta.md
      - "18. Vega": episodes/18-vega.md
  - Volatilité:
      - "19. Implied Volatility": episodes/19-implied-volatility.md
      - "20. The Gamma Squeeze": episodes/20-the-gamma-squeeze.md
      - "21. The Volatility Skew": episodes/21-the-volatility-skew.md
  - Stratégies:
      - "22. The Straddle": episodes/22-the-straddle.md
      - "23. The Strangle": episodes/23-the-strangle.md
      - "24. The Vertical Spread": episodes/24-the-vertical-spread.md
